# Zebra cargo configuration

[build]
rustdocflags = [
    # The -A and -W settings must be the same as the `RUSTDOCFLAGS` in:
    # https://github.com/ZcashFoundation/zebra/blob/main/.github/workflows/docs-deploy-firebase.yml#L68

    # Links in public docs can point to private items.
    "-Arustdoc::private_intra_doc_links",
]

# RandomX is C++. The GNU Windows toolchain does not link the C++ runtime on its own.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-lstdc++"]

[env]
RUST_BACKTRACE="1"

[resolver]
# Prefer dependency versions that build on our MSRV, instead of picking the
# newest version and failing on the oldest supported toolchain.
incompatible-rust-versions = "fallback"

[profile.profiling]
inherits = "release"
debug = true
