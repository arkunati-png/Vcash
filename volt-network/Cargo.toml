[package]
name = "volt-network"
version = "0.1.0"
description = "Voltcash networking: wire messages, framing, an in-process hub and a TCP peer-to-peer runtime"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
volt-core = { path = "../volt-core" }

blake2b_simd = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "net", "io-util", "time", "rt", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
zebra-chain = { path = "../zebra-chain" }
tokio = { workspace = true, features = ["sync", "net", "io-util", "time", "rt", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true